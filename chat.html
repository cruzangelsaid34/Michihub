/* Retomar música en segundo plano si estaba sonando en la página anterior */
(function retomarMusicaSiEstabaSonando(){
    const musicaSync = document.getElementById("bg-music-sync");
    if(localStorage.getItem("michihubMusicaEstado") === "reproduciendo"){
        musicaSync.play().catch(() => {
            // El navegador bloqueó el autoplay; no hay nada más que hacer aquí sin interacción del usuario
        });
    }
})();

/* LOGIN CON GOOGLE (igual que en index.html, para mantener la sesión) */
function decodificarJWT(token){
    let payload = token.split(".")[1];
    let json = decodeURIComponent(atob(payload).split("").map(c =>
        "%" + c.charCodeAt(0).toString(16).padStart(2, "0")
    ).join(""));
    return JSON.parse(json);
}

function manejarLoginGoogle(response){
    let datosUsuario = decodificarJWT(response.credential);
    let nombre = datosUsuario.name || datosUsuario.email;

    localStorage.setItem("michihubLogueado", "true");
    localStorage.setItem("michihubNombre", nombre);
    localStorage.setItem("michihubEmail", datosUsuario.email || "");
    localStorage.setItem("michihubFoto", datosUsuario.picture || "");

    document.getElementById("login-gate").classList.remove("activo");
    document.getElementById("link-cerrar-sesion").style.display = "inline-block";
}

function cerrarSesion(){
    localStorage.removeItem("michihubLogueado");
    localStorage.removeItem("michihubNombre");
    location.reload();
}
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("link-cerrar-sesion").addEventListener("click", cerrarSesion);
});

/* Verifica la sesión al entrar; si no hay login, bloquea el acceso */
(function verificarSesionObligatoria(){
    let logueado = localStorage.getItem("michihubLogueado") === "true";
    if(!logueado){
        document.getElementById("login-gate").classList.add("activo");
    }else{
        document.getElementById("link-cerrar-sesion").style.display = "inline-block";
    }
})();

/* PWA: manifest + ícono + service worker (para que Chrome ofrezca instalar desde cualquier página) */
function configurarPWA(){
    let linkApple = document.createElement("link");
    linkApple.rel = "apple-touch-icon";
    linkApple.href = "icon-192.png";
    document.head.appendChild(linkApple);

    let metaTheme = document.createElement("meta");
    metaTheme.name = "theme-color";
    metaTheme.content = "#b09e8d";
    document.head.appendChild(metaTheme);

    let linkManifest = document.createElement("link");
    linkManifest.rel = "manifest";
    linkManifest.href = "manifest.json";
    document.head.appendChild(linkManifest);

    if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
        navigator.serviceWorker.register("service-worker.js")
            .catch(err => console.log("No se pudo registrar el service worker:", err));
    }
}
configurarPWA();
</script>

        if(error || !data) return { estado: "activo" };

        // Si el silencio ya venció, se trata como activo
        if(data.estado === "silenciado" && data.hasta && new Date(data.hasta) < new Date()){
            return { estado: "activo" };
        }
        return data;
    }

    function fueMencionado(texto, nombreUsuario){
        if(!nombreUsuario) return false;
        // Compara la primera palabra del nombre (ej. "Ángel" de "Ángel Said Cruz Muñoz"),
        // sin distinguir mayúsculas/minúsculas ni acentos, para que "@angel" también cuente.
        let primerNombre = nombreUsuario.trim().split(/\s+/)[0];
        let normalizar = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        let patron = new RegExp("@" + normalizar(primerNombre).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
        return patron.test(normalizar(texto));
    }

    function notificarMensajeNuevo(msg){

        if(document.visibilityState === "visible") return; // app abierta: no molestar
        if(msg.usuario === obtenerNombreUsuario()) return; // no notificar tu propio mensaje

        let mencionado = fueMencionado(msg.texto, obtenerNombreUsuario());
        let titulo = mencionado ? `Michihub — ${msg.usuario} te mencionó` : `Michihub — ${msg.usuario}`;

        reproducirMeow();
        new Notification(titulo, {
            body: msg.texto,
            icon: "icon-192.png"
        });
    }

        if(msg.media_tipo === "video"){

        }
        if(msg.media_tipo === "audio"){
            return `<audio src="${msg.media_url}" controls style="margin-top:6px;width:100%;"></audio>`;
        }
        if(msg.media_tipo === "ubicacion"){
            return `<br><a href="${msg.media_url}" target="_blank" rel="noopener" style="color:#4a4238;font-weight:bold;">📍 Ver ubicación en el mapa</a>`;

    const PALETA_COLORES = ["#4ade80", "#fb923c", "#22d3ee", "#e879f9", "#facc15", "#60a5fa", "#f472b6", "#a3e635"];

    function colorParaUsuario(nombre){
        let hash = 0;
        for(let i = 0; i < nombre.length; i++){
            hash = nombre.charCodeAt(i) + ((hash << 5) - hash);
        }
        const indice = Math.abs(hash) % PALETA_COLORES.length;
        return PALETA_COLORES[indice];
    }

    async function enviarMensajeChat(){
        let texto = inputTexto.value.trim();
        if(!texto) return;

        const usuario = obtenerNombreUsuario();
        const correo = obtenerCorreoUsuario();

        // Comandos personales de bloqueo (disponibles para cualquier usuario)
        const partesTexto = texto.trim().split(/\s+/);
        if(partesTexto[0].toLowerCase() === "/bloquear"){
            const objetivo = partesTexto.slice(1).join(" ");
            if(!objetivo){ alert("Uso: /bloquear NombreUsuario"); inputTexto.value=""; return; }
            bloquearUsuario(objetivo);
            alert(`Ya no verás los mensajes de ${objetivo} (a partir de ahora).`);
            inputTexto.value = "";
            return;
        }
        if(partesTexto[0].toLowerCase() === "/desbloquear"){
            const objetivo = partesTexto.slice(1).join(" ");
            if(!objetivo){ alert("Uso: /desbloquear NombreUsuario"); inputTexto.value=""; return; }
            desbloquearUsuario(objetivo);
            alert(`Volverás a ver los mensajes de ${objetivo} (recarga la página).`);
            inputTexto.value = "";
            return;
        }

        // Comando personal: borrar tu última ubicación compartida (desaparece en tiempo real para todos)
        if(partesTexto[0].toLowerCase() === "/borrarubicacion"){
            const { data } = await supabaseChat
                .from("mensajes")
                .select("id")
                .eq("usuario", usuario)
                .eq("media_tipo", "ubicacion")
                .order("created_at", { ascending: false })
                .limit(1);

            if(data && data.length){
                await supabaseChat.from("mensajes").delete().eq("id", data[0].id);
            }else{
                alert("No tienes ninguna ubicación compartida para borrar.");
            }
            inputTexto.value = "";
            return;
        }

        // Comandos de administrador (solo el CEO puede usarlos)
        if(esAdmin() && texto.startsWith("/") && texto.toLowerCase() !== "/soporte"){
            const eraComando = await ejecutarComandoAdmin(texto);
            if(eraComando){
                inputTexto.value = "";
                return;
            }
        }

        // Comando /soporte, disponible para todos
        if(texto.toLowerCase() === "/soporte"){
            texto = "📧 Soporte de Michihub: michihub@hotmail.com";
        }

        // Revisar si el chat está cerrado (el admin siempre puede escribir)
        if(!esAdmin()){
            const cerrado = await obtenerChatCerrado();
            if(cerrado){
                alert("El chat está cerrado temporalmente por el administrador.");
                return;
            }

            // Revisar si el usuario está silenciado o baneado
            const estadoMod = await obtenerEstadoModeracion(usuario);
            if(estadoMod.estado === "baneado"){
                alert("Has sido baneado del chat.");
                return;
            }
            if(estadoMod.estado === "silenciado"){
                alert("Estás silenciado temporalmente y no puedes enviar mensajes.");
                return;
            }

            // ANTI-LINK: bloquear enlaces para usuarios normales
            const patronLink = /(https?:\/\/|www\.|\.(com|net|org|io|co|gg|xyz|info|me|ly|app|dev|es|mx)\b)/i;
            if(patronLink.test(texto)){
                alert("No se permiten enlaces en el chat.");
                return;
            }

            // FILTRO AUTOMÁTICO: droga, armas, alcohol, sexo y groserías
            const categoriaProhibida = detectarContenidoProhibido(texto);
            if(categoriaProhibida){
                await aplicarInfraccionAutomatica(usuario, correo, categoriaProhibida);
                inputTexto.value = "";
                return;
            }
        }

        const { error } = await supabaseChat
            .from("mensajes")
            .insert([{ usuario, texto, correo, avatar_url: obtenerFotoUsuario() }]);

        if(error){
            console.error("Error enviando mensaje del chat:", error);
            return;
        }
        inputTexto.value = "";
    }

        navigator.geolocation.getCurrentPosition(async (posicion) => {
            const { latitude, longitude } = posicion.coords;
            const link = `https://www.google.com/maps?q=${latitude},${longitude}`;
            const usuario = obtenerNombreUsuario();
            await supabaseChat.from("mensajes").insert([{
                usuario,
                texto: "📍 Compartió su ubicación",
                correo: obtenerCorreoUsuario(),
                media_url: link,
                media_tipo: "ubicacion",
                avatar_url: obtenerFotoUsuario()
            }]);
        }, () => {
            alert("No se pudo obtener tu ubicación. Revisa los permisos del navegador.");
        });
    });

    /* COMPARTIR EVENTO */
    btnEvento.addEventListener("click", async () => {
        const titulo = prompt("Título del evento:");
        if(!titulo) return;
        const fecha = prompt("Fecha y hora (ej. 10 de septiembre, 8:00 PM):");
        const lugar = prompt("Lugar (opcional):");

        let texto = `📅 Evento: ${titulo}`;
        if(fecha) texto += `\n🗓️ ${fecha}`;
        if(lugar) texto += `\n📍 ${lugar}`;

        const usuario = obtenerNombreUsuario();
        await supabaseChat.from("mensajes").insert([{ usuario, texto, correo: obtenerCorreoUsuario(), avatar_url: obtenerFotoUsuario() }]);
    });

    inputTexto.addEventListener("keydown", (e) => {
        if(e.key === "Enter") enviarMensajeChat();
    });

    // Tiempo real: mostrar mensajes nuevos de cualquier usuario al instante
    supabaseChat
        .channel("mensajes-realtime")
        .on(
            "postgres_changes",
            { event: "INSERT", schema: "public", table: "mensajes" },
            (payload) => {
                mostrarMensajeChat(payload.new);
                notificarMensajeNuevo(payload.new);
            }
        )
        .on(
            "postgres_changes",
            { event: "DELETE", schema: "public", table: "mensajes" },
            (payload) => {
                const elemento = mensajesDiv.querySelector(`[data-msg-id="${payload.old.id}"]`);
                if(elemento) elemento.remove();
            }
        )
        .subscribe();

    cargarMensajesChat();

    /* PRESENCIA EN TIEMPO REAL (quién está conectado ahora) */
    const divEnLinea = document.getElementById("usuarios-en-linea");
    const canalPresencia = supabaseChat.channel("presencia-chat", {
        config: { presence: { key: obtenerNombreUsuario() } }
    });

    function actualizarListaEnLinea(){
        const estado = canalPresencia.presenceState();
        const nombres = Object.keys(estado);
        usuariosConectadosActual = nombres;
        divEnLinea.textContent = "🟢 " + nombres.length + " conectado" + (nombres.length === 1 ? "" : "s");
    }

    canalPresencia
        .on("presence", { event: "sync" }, actualizarListaEnLinea)
        .subscribe(async (status) => {
            if(status === "SUBSCRIBED"){
                await canalPresencia.track({ usuario: obtenerNombreUsuario() });
            }
        });
})();
</script>


<script>
/* PANTALLA DE CARGA */
let loadingTimeoutId = null;

function mostrarPantallaCarga(){
    let loading = document.getElementById("loading-screen");
    if(!loading) return;

    clearTimeout(loadingTimeoutId);
    loading.classList.remove("fade-out");

    loadingTimeoutId = setTimeout(() => {
        loading.classList.add("fade-out");
    }, 2200);
}

window.addEventListener("load", mostrarPantallaCarga);
window.addEventListener("pageshow", (e) => {
    if(e.persisted) mostrarPantallaCarga();
});
document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible") mostrarPantallaCarga();
});
mostrarPantallaCarga();
</script>
